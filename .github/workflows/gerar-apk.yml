name: Compilar Free My TV + UniTVnet
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Tools e plataforma
        run: sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0'
      - name: Clonar versao oficial fixa
        run: git clone --depth 1 --branch v1.3.0 https://github.com/simbasjungles/free-my-tv.git projeto
      - name: Aplicar personalizacao
        run: python3 personalizar.py projeto
      - name: Compilar sem chave TMDB embutida
        run: |
          cd projeto
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash build.sh --generic
      - name: Guardar APK e chave de assinatura para futuras atualizacoes
        uses: actions/upload-artifact@v4
        with:
          name: freemytv-unitvnet-v1
          path: |
            projeto/FreeMyTV.apk
            projeto/freemytv.keystore
          if-no-files-found: error
