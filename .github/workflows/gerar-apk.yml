name: Free My TV (fase 10 - pre-release)
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/discover-v2', 'feature/discover-v2-tv-epg-stable', 'feature/launcher-original-tv-epg', 'feature/home-redesign-phase-1', 'feature/home-redesign-phase-2', 'feature/guide-compact-phase-3', 'feature/movies-catalog-phase-4', 'feature/series-catalog-phase-5', 'feature/stability-settings-phase-6', 'feature/release-readiness-phase-7', 'feature/epg-catalog-hardening-phase-8', 'feature/android-smoke-phase-9', 'feature/release-pipeline-phase-10']
    paths:
      - personalizar.py
      - extensions/**
      - tests/**
      - tools/**
      - docs/FASE-10-RELEASE.md
      - .github/workflows/gerar-apk.yml
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK nativo do runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Usando SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;35.0.0'
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-34|build-tools;35.0.0'

      - name: Conferir sintaxe e identidade de producao bloqueada por assinatura
        run: |
          python3 -m py_compile personalizar.py
          python3 tests/phase10_identity.py
          python3 tests/phase10_release_guard.py
      - name: Clonar versao oficial fixa
        run: git clone --depth 1 --branch v1.3.0 https://github.com/simbasjungles/free-my-tv.git projeto
      - name: Aplicar personalizacao
        run: python3 personalizar.py projeto
      - name: Verificar integrações, privilégios e persistência
        run: |
          python3 tests/phase6_smoke.py projeto io.freemytv.homep10test
          python3 tests/phase7_smoke.py projeto io.freemytv.homep10test 10 3.4-phase10-preview
          python3 tests/phase8_smoke.py projeto io.freemytv.homep10test 10 3.4-phase10-preview
      - name: Compilar sem chave TMDB embutida
        env:
          FREEMYTV_SIGNING_B64: ${{ secrets.FREEMYTV_KEYSTORE_BASE64 }}
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.FREEMYTV_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "${FREEMYTV_SIGNING_B64:-}" ]; then
            if [ -z "${FREEMYTV_KEYSTORE_PASS:-}" ]; then
              echo "::error::FREEMYTV_KEYSTORE_PASS ausente para keystore configurado" >&2
              exit 1
            fi
            printf '%s' "$FREEMYTV_SIGNING_B64" | base64 --decode > projeto/signing-private.keystore
            export FREEMYTV_KEYSTORE="$GITHUB_WORKSPACE/projeto/signing-private.keystore"
            echo "Assinatura persistente ativada via Secrets."
          else
            echo "::warning::Sem Secrets: assinatura de teste provisória; não permite atualizar outra compilação sem reinstalar."
          fi
          cd projeto
          trap 'rm -f signing-private.keystore' EXIT
          bash build.sh --generic
      - name: Validar APK, assinatura e manifesto
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="projeto/FreeMyTV.apk"
          test -s "$APK"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | head -n 12
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'DiscoverActivity' /tmp/manifest.txt
          grep -q 'MoviesActivity' /tmp/manifest.txt
          grep -q 'SeriesActivity' /tmp/manifest.txt
          grep -q 'HomeFavoritesActivity' /tmp/manifest.txt
          grep -q 'EpgActivity' /tmp/manifest.txt
          grep -q 'HomeActivity' /tmp/manifest.txt
          grep -q 'io.freemytv' /tmp/manifest.txt
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' /tmp/manifest.txt
          grep -q 'android.intent.category.HOME' /tmp/manifest.txt
          grep -q 'io.freemytv.HomeActivity' /tmp/manifest.txt
          grep -q 'io.freemytv.homep10test' /tmp/manifest.txt
          "$BT/aapt" dump badging "$APK" | grep -q "launchable-activity: name='io.freemytv.HomeActivity'"
          test -s projeto/app/src/io/freemytv/HomeChannelPins.java
          test -s projeto/app/src/io/freemytv/HomeImageCache.java
          test -s projeto/app/src/io/freemytv/HomeDashboardView.java
          test -s projeto/app/src/io/freemytv/HomeEpgSnapshot.java
          test -s projeto/app/src/io/freemytv/EpgFeedCache.java
          test -s projeto/app/src/io/freemytv/MoviesActivity.java
          test -s projeto/app/src/io/freemytv/SeriesActivity.java
          test -s projeto/app/src/io/freemytv/MediaCatalogActivity.java
          test -s projeto/app/src/io/freemytv/HomeFavoritesActivity.java
          test -s projeto/app/src/io/freemytv/HomeFavoritesTransfer.java
          grep -q 'MAX_PINNED = 30' projeto/app/src/io/freemytv/HomeChannelPins.java
          grep -q 'TvRemotePress.bind' projeto/app/src/io/freemytv/EpgActivity.java
          test -s projeto/app/src/io/freemytv/TvRemotePress.java
          grep -q 'HOLD_MS = 625L' projeto/app/src/io/freemytv/TvRemotePress.java
          grep -q '"Fixados"' projeto/app/src/io/freemytv/EpgActivity.java
          grep -q 'visibleLimit+=PAGE' projeto/app/src/io/freemytv/EpgActivity.java
          grep -q 'HomeImageCache.read' projeto/app/src/io/freemytv/EpgActivity.java
          if grep -q 'android:canRetrieveWindowContent="true"' projeto/app/res/xml/remote_key_service.xml; then
            echo 'ERRO: acessibilidade nao deve ler conteudo de outros apps nesta fase' >&2
            exit 1
          fi
          grep -q 'dashboard = new HomeDashboardView(this)' projeto/app/src/io/freemytv/HomeActivity.java
          grep -q 'dashboard.resume()' projeto/app/src/io/freemytv/HomeActivity.java
          grep -q 'initial_kind' projeto/app/src/io/freemytv/DiscoverActivity.java
          grep -q 'HomeChannelPins.list' projeto/app/src/io/freemytv/HomeDashboardView.java
          grep -q 'HomeApps.shelfPackages' projeto/app/src/io/freemytv/HomeDashboardView.java
          grep -q 'new Intent(activity,MoviesActivity.class)' projeto/app/src/io/freemytv/HomeDashboardView.java
          grep -q 'new Intent(activity,SeriesActivity.class)' projeto/app/src/io/freemytv/HomeDashboardView.java
          grep -q 'new Intent(this,MoviesActivity.class)' projeto/app/src/io/freemytv/EpgActivity.java
          grep -q 'new Intent(this,SeriesActivity.class)' projeto/app/src/io/freemytv/EpgActivity.java
          grep -q 'onScroll(AbsListView view,int first,int visible,int total)' projeto/app/src/io/freemytv/MediaCatalogActivity.java
          grep -q 'DiscoverData.from(response,type())' projeto/app/src/io/freemytv/MediaCatalogActivity.java
          grep -q '"/discover/"+media' projeto/app/src/io/freemytv/MediaCatalogActivity.java
          grep -q '"/search/"+media' projeto/app/src/io/freemytv/MediaCatalogActivity.java
          grep -q 'TV_GENRE_IDS' projeto/app/src/io/freemytv/MediaCatalogActivity.java
          grep -q 'PendingUniSearch.remember(this,item.title)' projeto/app/src/io/freemytv/MediaCatalogActivity.java
          grep -q 'epgRequestId' projeto/app/src/io/freemytv/HomeDashboardView.java
          grep -q 'HomeFavoritesTransfer.export(this)' projeto/app/src/io/freemytv/HomeFavoritesActivity.java
          grep -q 'fallbackToClassic' projeto/app/src/io/freemytv/HomeActivity.java
          grep -q 'heroRequestId' projeto/app/src/io/freemytv/HomeDashboardView.java
          grep -q 'MAX_FILE_BYTES = 900_000' projeto/app/src/io/freemytv/HomeImageCache.java
          grep -q 'for(String feed:EpgFeedCache.FEEDS)' projeto/app/src/io/freemytv/EpgActivity.java
          grep -q 'EpgFeedCache.get(context, feed)' projeto/app/src/io/freemytv/HomeEpgSnapshot.java
          grep -q 'ch.key=HomeChannelPins.canonical(ch.name)' projeto/app/src/io/freemytv/EpgActivity.java
          echo "OK: HOME, shared EPG sources/cache, persistent pins, remote focus and catalogs."
      - name: Preparar pacote de pre-lancamento da Fase 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pacote-fase10
          cp projeto/FreeMyTV.apk pacote-fase10/FreeMyTV-Fase-10-Teste.apk
          cp tools/tcl-diagnostico.ps1 pacote-fase10/tcl-diagnostico.ps1
          cp docs/FASE-10-RELEASE.md pacote-fase10/LEIA-ME-Fase-10.md
          cp projeto/LICENSE pacote-fase10/LICENSE-Free-My-TV-MIT.txt
          (cd pacote-fase10 && sha256sum FreeMyTV-Fase-10-Teste.apk > SHA256.txt)
          test -s pacote-fase10/FreeMyTV-Fase-10-Teste.apk
          test -s pacote-fase10/SHA256.txt
      - name: Publicar APK e roteiro de homologacao
        uses: actions/upload-artifact@v4
        with:
          name: freemytv-phase10-preview-test
          path: |
            pacote-fase10/*
          if-no-files-found: error

  emulator:
    name: Android emulator runtime smoke (not TCL hardware)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17 (emulator tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact APK from build job
        uses: actions/download-artifact@v4
        with:
          name: freemytv-phase10-preview-test
          path: install-packet
      - name: Enable KVM virtualization
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo "::warning::Runner has no /dev/kvm; emulator may be slow."
          fi
      - name: Boot emulator, launch Home and simulate remote commands
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/phase9_emulator.sh install-packet/FreeMyTV-Fase-10-Teste.apk emulator-results io.freemytv.homep10test
      - name: Preserve diagnostic log even if emulator fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freemytv-phase10-emulator-diagnostics
          path: emulator-results/*
          if-no-files-found: ignore
