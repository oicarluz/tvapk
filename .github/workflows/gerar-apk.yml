name: Compilar Free My TV + UniTVnet
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/discover-v2', 'feature/discover-v2-tv-epg-stable', 'feature/launcher-original-tv-epg', 'feature/unitvnet-channel-navigation', 'feature/unitvnet-accessibility-fix']
    paths:
      - personalizar.py
      - extensions/**
      - .github/workflows/gerar-apk.yml
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK nativo do runner
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Usando SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;35.0.0'
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-34|build-tools;35.0.0'

      - name: Conferir sintaxe Python antes do download
        run: python3 -m py_compile personalizar.py
      - name: Clonar versao oficial fixa
        run: git clone --depth 1 --branch v1.3.0 https://github.com/simbasjungles/free-my-tv.git projeto
      - name: Aplicar personalizacao
        run: python3 personalizar.py projeto
      - name: Compilar sem chave TMDB embutida
        run: |
          cd projeto
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash build.sh --generic
      - name: Validar APK, assinatura e manifesto
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="projeto/FreeMyTV.apk"
          test -s "$APK"
          "$BT/zipalign" -c -p 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | head -n 12
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'DiscoverActivity' /tmp/manifest.txt
          grep -q 'EpgActivity' /tmp/manifest.txt
          grep -q 'HomeActivity' /tmp/manifest.txt
          grep -q 'io.freemytv' /tmp/manifest.txt
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' /tmp/manifest.txt
          grep -q 'android.intent.category.HOME' /tmp/manifest.txt
          grep -q 'io.freemytv.HomeActivity' /tmp/manifest.txt
          grep -q 'io.freemytv.unitvassisttest' /tmp/manifest.txt
          grep -q 'RemoteKeyService' /tmp/manifest.txt
          grep -q 'UniChannelService' /tmp/manifest.txt
          grep -q 'android.permission.BIND_ACCESSIBILITY_SERVICE' /tmp/manifest.txt
          "$BT/aapt" dump badging "$APK" | grep -q "launchable-activity: name='io.freemytv.HomeActivity'"
          "$BT/aapt" dump xmltree "$APK" res/xml/unitv_channel_service.xml > /tmp/unitv-accessibility.txt
          grep -q 'android:canRetrieveWindowContent' /tmp/unitv-accessibility.txt
          grep -q 'com.unitvnet.tvod' /tmp/unitv-accessibility.txt
          echo "OK: launcher e servico dedicado UniChannelService detectados no APK."
      - name: Publicar APK de homologacao (sem chave privada)
        uses: actions/upload-artifact@v4
        with:
          name: freemytv-unitvnet-accessibility-v24-test
          path: |
            projeto/FreeMyTV.apk
          if-no-files-found: error
